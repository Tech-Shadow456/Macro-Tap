name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MacroTap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
EOFcd ~/Macro-Tap
D=app/src/main/java/com/macrotap/app
R=app/src/main/res

cat > $R/values/strings.xml <<'EOF'
<resources>
    <string name="acc_desc">Drivex Play uses this only to perform the taps and swipes of your macros, take screenshots when you ask, and to see which app is in front so it can apply your game profiles. It does not read your screen content.</string>
</resources>
